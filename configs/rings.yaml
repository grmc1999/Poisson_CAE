# Concentric-rings classification (2D).
data:
  experiment: rings
  batch_size: 256
  seed: 0
  encoder_type: mlp

model:
  hidden: 128
  z_dim: 32

train:
  lr: 1.0e-3
  lam: 1.0e-2
  landmarks: 256
  steps: 5000
  viz_every: 500
  viz_dir: outputs
  corruption_mode: gaussian
  corruption_sigma: 0.1

estimator:
  scheme: compact
  kernel_type: diffusion
  t: 0.25
  eps: 1.0e-2
  radius: 1.5
  max_neighbors: 64
  normalize: true