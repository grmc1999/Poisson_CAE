# Variational (bilevel) Mixture-of-3-Gaussians reconstruction (2D).
# Used for the reconstruction-sample / perturbation-scheme gallery (sample_recon.py).
name: mog
data:
  experiment: mog
  batch_size: 256
  seed: 0
  encoder_type: mlp

model:
  hidden: 128
  z_dim: 32

train:
  lr: 1.0e-3
  lam: 1.0e-2
  landmarks: 256
  steps: 5000
  viz_every: 500
  viz_dir: outputs
  corruption_mode: gaussian
  corruption_T: 200
  corruption_beta_start: 1.0e-4
  corruption_beta_end: 2.0e-2
  corruption_sigma: 0.1
  poisson_eps: 1.0e-2

estimator:
  scheme: variational
  kernel_type: diffusion
  t: 0.5
  eps: 1.0e-2
  radius: 2.0
  max_neighbors: 64
  k: 32
  normalize: true
  mu: 1.0e-2
  v_hidden: 128
  v_layers: 3
  inner_steps: 100
  inner_lr: 0.1
  lam_d: 1.0
  inner_max_grad_norm: 0.5
  bilevel: true